<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16201C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agenda</title>
<style>
:root{
  --papel:#E7EAE5;
  --papel2:#F3F5F1;
  --tinta:#16201C;
  --grafito:#5A6660;
  --plomo:#C9D0C9;
  --alerta:#9E2B1E;
  --aviso:#8A6B00;
  --hecho:#2E6B58;
  /* un color por responsable */
  --r0:#6A3B5C;  /* S1 personal */
  --r1:#2B5566;  /* S2 información y seguridad */
  --r2:#4E5B2B;  /* S3 operaciones */
  --r3:#7A4A1E;  /* S4 logística */
  --r4:#34407A;  /* Batería de Servicios */
  --mono:ui-monospace,"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);color:var(--tinta);font-family:var(--sans);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}

.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--grafito)}

/* ---------- estructura ---------- */
.app{max-width:1400px;margin:0 auto;padding:0 20px 80px}
header.top{
  border-bottom:2px solid var(--tinta);padding:22px 0 14px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
}
.brand{flex:1 1 260px;min-width:0}
.brand h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.brand .sub{font-size:13px;color:var(--grafito);margin-top:2px}
.hoy{text-align:right;font-family:var(--mono);font-size:13px;color:var(--grafito)}
.hoy strong{display:block;font-size:19px;color:var(--tinta);letter-spacing:-.01em}

.tally{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--plomo)}
.tally > div{padding:12px 20px 12px 0;margin-right:20px;border-right:1px solid var(--plomo)}
.tally > div:last-child{border-right:none}
.tally .n{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
.tally .n.rojo{color:var(--alerta)}
.tally .n.ambar{color:var(--aviso)}
.tally .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grafito);margin-top:4px}

nav.tabs{display:flex;gap:2px;margin:16px 0 0;flex-wrap:wrap}
nav.tabs button{
  background:none;border:1px solid transparent;border-bottom:none;
  padding:8px 14px;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grafito);border-radius:3px 3px 0 0;
}
nav.tabs button:hover{color:var(--tinta);background:var(--papel2)}
nav.tabs button[aria-selected="true"]{
  background:var(--papel2);border-color:var(--plomo);color:var(--tinta);
  box-shadow:inset 0 3px 0 var(--tinta);
}
.panel{background:var(--papel2);border:1px solid var(--plomo);border-radius:0 3px 3px 3px;padding:18px;min-width:0}

/* ---------- barra de filtros ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.bar input[type=text],.bar select{background:#fff;border:1px solid var(--plomo);border-radius:2px;padding:7px 9px}
.bar input[type=text]{min-width:200px;flex:1 1 200px}
.btn{
  background:var(--tinta);color:var(--papel2);border:1px solid var(--tinta);
  border-radius:2px;padding:7px 14px;font-weight:600;font-size:13px;
}
.btn:hover{background:#0b120f}
.btn.ghost{background:transparent;color:var(--tinta);border-color:var(--plomo)}
.btn.ghost:hover{background:var(--papel);border-color:var(--grafito)}
.btn.peligro{background:transparent;color:var(--alerta);border-color:var(--alerta)}
.btn.peligro:hover{background:var(--alerta);color:#fff}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--plomo);border-radius:2px;overflow:hidden;background:#fff}
.seg button{background:none;border:none;padding:7px 12px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--grafito)}
.seg button[aria-pressed="true"]{background:var(--tinta);color:var(--papel2)}

/* ---------- agenda ---------- */
.grupo-cab{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
.grupo-cab .linea{flex:1;height:1px;background:var(--plomo)}
.grupo-cab .cuenta{font-family:var(--mono);font-size:11px;color:var(--grafito)}
.grupo-cab .eyebrow.rojo{color:var(--alerta)}
.grupo-cab .pista-txt{font-size:11px;color:var(--grafito);font-style:italic}

.fila{
  display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:10px 8px;border:none;border-bottom:1px solid rgba(90,102,96,.16);
  background:transparent;text-align:left;width:100%;
}
.fila:hover{background:#fff}
.dist{font-family:var(--mono);font-weight:700;text-align:right;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.dist .fecha{display:block;font-size:10px;font-weight:400;color:var(--grafito);letter-spacing:0;margin-top:4px}
.dist .sub{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grafito);margin-top:3px}
.dist.viejo{color:var(--alerta)}
.dist.nada{color:var(--plomo);font-weight:400}
.titulo{display:block;font-weight:600;letter-spacing:-.01em}
.meta{display:block;font-size:12px;color:var(--grafito);margin-top:2px}
.meta .sep{opacity:.5;margin:0 6px}
.avisillo{color:var(--aviso);font-weight:600}
.tag{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;
  border:1px solid currentColor;border-radius:2px;padding:1px 5px;vertical-align:1px;white-space:nowrap;
}
.tag.r0{color:var(--r0)} .tag.r1{color:var(--r1)} .tag.r2{color:var(--r2)} .tag.r3{color:var(--r3)} .tag.r4{color:var(--r4)}
.tag.act{color:var(--tinta);background:var(--plomo);border-color:transparent;margin-right:4px}
.acc{display:flex;gap:6px;align-items:center}
.check{
  width:26px;height:26px;border:1px solid var(--plomo);background:#fff;border-radius:2px;
  font-size:14px;line-height:1;color:var(--hecho);padding:0;display:inline-flex;align-items:center;justify-content:center;
}
.check:hover{border-color:var(--hecho)}

.b0 .dist{font-size:30px;color:var(--alerta)}
.b1 .dist{font-size:28px;color:var(--alerta)}
.b2 .dist{font-size:24px;color:var(--aviso)}
.b3 .dist{font-size:21px}
.b4 .dist{font-size:19px}
.b5 .dist{font-size:17px}
.b6 .dist{font-size:15px}
.b7 .dist{font-size:13px;color:var(--grafito)}
.basap .dist{font-size:26px}
.bsin .dist{font-size:20px}
.bsin .fila,.b5 .fila,.b6 .fila,.b7 .fila{padding:7px 8px}
.b6 .titulo,.b7 .titulo{font-weight:500;font-size:14px}
.b7{opacity:.8}
.fila.done .titulo{text-decoration:line-through;color:var(--grafito)}
.fila.done .dist{color:var(--hecho)}

.vacio{border:1px dashed var(--plomo);border-radius:3px;padding:34px 24px;text-align:center;color:var(--grafito)}
.vacio p{margin:0 0 14px}

/* ---------- subtareas (checklist) ---------- */
.grupo-item{border-bottom:1px solid rgba(90,102,96,.16)}
.grupo-item .fila{border-bottom:none}
.fila.act{cursor:pointer}
.progreso{display:block;height:4px;background:var(--plomo);border-radius:2px;margin-top:6px;max-width:280px;overflow:hidden}
.progreso span{display:block;height:100%;background:var(--hecho)}
.conteo{font-family:var(--mono);font-size:11px;color:var(--grafito);white-space:nowrap}
.conteo.todo{color:var(--hecho);font-weight:700}
.chevron{
  display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  color:var(--grafito);font-size:11px;border:1px solid transparent;border-radius:2px;background:none;padding:0;
}
button.chevron:hover{border-color:var(--plomo);background:#fff}
.lista{margin:0 0 10px 88px;border-left:2px solid var(--plomo);padding:2px 0 2px 12px}
.modal .lista{margin-left:0}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 6px 4px 0}
.ck:hover{background:#fff}
.ck-box{
  width:20px;height:20px;border:1px solid var(--plomo);background:#fff;border-radius:2px;
  color:var(--hecho);font-size:12px;line-height:18px;text-align:center;padding:0;cursor:pointer;
}
.ck-box:hover{border-color:var(--hecho)}
.ck-nom{font-size:13px;cursor:pointer}
.ck-nom:hover{text-decoration:underline}
.ck-nom .quien{color:var(--grafito);font-weight:400}
.ck-cuando{font-family:var(--mono);font-size:11px;color:var(--grafito);white-space:nowrap}
.ck.hecho .ck-nom{text-decoration:line-through;color:var(--grafito)}
.ck.hecho .ck-box{background:var(--hecho);border-color:var(--hecho);color:#fff}
.ck.vencido .ck-cuando{color:var(--alerta);font-weight:700}
.ck.hoy .ck-cuando{color:var(--aviso);font-weight:700}
.ck-pie{padding:8px 0 2px;display:flex;gap:8px;flex-wrap:wrap}
.ck-pie button{background:none;border:1px dashed var(--plomo);border-radius:2px;font-size:11px;padding:4px 8px;color:var(--grafito)}
.ck-pie button:hover{color:var(--tinta);border-color:var(--grafito);border-style:solid}

/* editor de subtareas en la ventana */
.subs{border:1px solid var(--plomo);border-radius:2px;background:#fff;padding:4px 8px}
.sub{display:grid;grid-template-columns:24px minmax(0,1fr) 140px 26px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(90,102,96,.12)}
.sub:last-of-type{border-bottom:none}
.sub input[type=text],.sub input[type=date]{width:100%;border:1px solid transparent;background:none;padding:6px;border-radius:2px}
.sub input[type=text]:hover,.sub input[type=text]:focus,.sub input[type=date]:hover,.sub input[type=date]:focus{border-color:var(--plomo);background:var(--papel2)}
.sub input[type=date]{font-family:var(--mono);font-size:12px;color:var(--grafito)}
.sub.hecho input[type=text]{text-decoration:line-through;color:var(--grafito)}
.sub .ck-box{width:22px;height:22px;line-height:20px}
.sub.hecho .ck-box{background:var(--hecho);border-color:var(--hecho);color:#fff}
.sub-vacio{font-size:12px;color:var(--grafito);font-style:italic;padding:8px 0}
.sub-add{margin:6px 0 2px;background:none;border:1px dashed var(--plomo);border-radius:2px;font-size:12px;padding:6px 10px;color:var(--grafito);width:100%}
.sub-add:hover{color:var(--tinta);border-color:var(--grafito);border-style:solid}
.mini{background:none;border:none;color:var(--grafito);font-size:16px;line-height:1;padding:4px 8px}
.mini:hover{color:var(--alerta)}

/* ---------- mes ---------- */
.mescab{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mescab h2{font-size:19px;margin:0;letter-spacing:-.01em;text-transform:capitalize}
.rejilla-scroll{overflow-x:auto}
.rejilla{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--plomo);border:1px solid var(--plomo);min-width:560px}
.rejilla .dow{background:var(--papel);padding:6px 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grafito);font-weight:700;text-align:center}
.dia{background:#fff;min-height:96px;padding:5px 6px;text-align:left;border:none;display:block;width:100%;min-width:0}
.dia:hover{background:#FBFCFA}
.dia.fuera{background:var(--papel);opacity:.55}
.dia.hoy{box-shadow:inset 0 0 0 2px var(--tinta)}
.dia .num{font-family:var(--mono);font-size:12px;color:var(--grafito)}
.dia.hoy .num{color:var(--tinta);font-weight:700}
.chip{
  display:block;font-size:11px;line-height:1.3;margin-top:3px;padding:2px 4px;border-radius:2px;
  background:var(--papel);border-left:3px solid var(--grafito);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip.r0{border-left-color:var(--r0)} .chip.r1{border-left-color:var(--r1)} .chip.r2{border-left-color:var(--r2)}
.chip.r3{border-left-color:var(--r3)} .chip.r4{border-left-color:var(--r4)}
.chip.vencido{border-left-color:var(--alerta);color:var(--alerta)}
.chip.done{opacity:.5;text-decoration:line-through}
.chip.act{background:var(--plomo);font-weight:700}
.chip .cl{font-family:var(--mono);font-weight:400;opacity:.75}
.chip.mas{background:none;border:none;color:var(--grafito);font-family:var(--mono);font-size:10px;padding-left:0}

/* ---------- año ---------- */
.anio-cab{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:end;margin-bottom:6px}
.meses{display:grid;grid-template-columns:repeat(12,1fr);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grafito);font-weight:700}
.meses span{text-align:center;border-left:1px solid var(--plomo);padding-bottom:4px}
.pista-fila{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;padding:5px 0}
.pista-nom{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pista{position:relative;height:24px;background:#fff;border:1px solid var(--plomo);overflow:hidden;width:100%;padding:0}
.pista .mesline{position:absolute;top:0;bottom:0;width:1px;background:var(--plomo)}
.pista .barra{position:absolute;top:5px;height:14px;border-radius:2px;min-width:4px;background:var(--grafito)}
.pista .barra.r0{background:var(--r0)} .pista .barra.r1{background:var(--r1)} .pista .barra.r2{background:var(--r2)}
.pista .barra.r3{background:var(--r3)} .pista .barra.r4{background:var(--r4)}
.pista .hito{position:absolute;top:2px;width:2px;height:20px;background:var(--grafito)}
.pista .hito.vencido{background:var(--alerta);width:3px}
.pista .hoyline{position:absolute;top:0;bottom:0;width:2px;background:var(--alerta);opacity:.85}

/* ---------- notas ---------- */
.notas-rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.nota-card{
  background:#fff;border:1px solid var(--plomo);border-radius:3px;padding:12px 14px;text-align:left;
  display:flex;flex-direction:column;gap:6px;min-height:150px;min-width:0;
}
.nota-card:hover{border-color:var(--grafito)}
.nota-card .nt{font-weight:700;letter-spacing:-.01em;font-size:15px;display:flex;gap:6px;align-items:baseline}
.nota-card .nt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nota-card .estrella{color:var(--aviso);flex:none}
.nota-card .np{
  font-size:13px;color:var(--grafito);white-space:pre-wrap;word-break:break-word;flex:1;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}
.nota-card .nf{font-family:var(--mono);font-size:10px;color:var(--grafito)}
.nota-card .tag{align-self:flex-start}

.editor-nota{max-width:820px;margin:0 auto}
.en-barra{
  position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--papel2);padding:6px 0 10px;border-bottom:1px solid var(--plomo);margin-bottom:10px;
}
.en-barra .espacio{flex:1}
.en-barra .guardado{font-family:var(--mono);font-size:11px;color:var(--grafito)}
.btn.estrella[aria-pressed="true"]{color:var(--aviso);border-color:var(--aviso)}
.en-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.en-meta select{background:#fff;border:1px solid var(--plomo);border-radius:2px;padding:6px 8px;font-size:13px}
.en-tit{
  width:100%;border:none;background:none;font-size:24px;font-weight:700;letter-spacing:-.02em;
  padding:6px 0;outline:none;
}
.en-tit::placeholder{color:var(--plomo)}
.en-cuerpo{
  width:100%;min-height:55vh;border:none;background:none;resize:none;outline:none;
  font-size:17px;line-height:1.65;padding:6px 0 40px;overflow:hidden;
}
.en-cuerpo::placeholder{color:var(--plomo)}
.en-pie{font-family:var(--mono);font-size:11px;color:var(--grafito);border-top:1px solid var(--plomo);padding-top:8px}

/* ---------- bloc de despacho ---------- */
.cuerpo{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.cuerpo.ancho{grid-template-columns:minmax(0,1fr)}
.despacho{
  position:sticky;top:14px;background:var(--papel2);border:1px solid var(--plomo);
  border-radius:3px;padding:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;
}
.desp-cab{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.desp-cuenta{font-family:var(--mono);font-size:11px;color:var(--grafito)}
.desp-cuenta.rojo{color:var(--alerta);font-weight:700}
.desp-fecha{font-family:var(--mono);font-size:11px;color:var(--grafito);margin:3px 0 10px}
.desp-alta{display:flex;gap:6px;margin-bottom:8px}
.desp-alta input{flex:1 1 auto;min-width:0;background:#fff;border:1px solid var(--plomo);border-radius:2px;padding:7px 8px;font-size:13px}
.desp-alta button{padding:7px 11px;font-size:15px;line-height:1}
.desp-lista{overflow:auto;margin:0 -4px;padding:0 4px}
.dp{display:grid;grid-template-columns:20px minmax(0,1fr) 18px;gap:8px;align-items:start;padding:6px 2px;border-bottom:1px solid rgba(90,102,96,.14)}
.dp:last-child{border-bottom:none}
.dp-box{width:20px;height:20px;border:1px solid var(--plomo);background:#fff;border-radius:2px;color:var(--hecho);font-size:12px;line-height:18px;text-align:center;padding:0}
.dp-box:hover{border-color:var(--hecho)}
.dp-txt{font-size:13px;line-height:1.35;text-align:left;word-break:break-word;background:none;border:none;padding:0;width:100%}
.dp-txt:hover{text-decoration:underline}
.dp-dias{display:block;font-family:var(--mono);font-size:10px;color:var(--grafito);margin-top:2px;text-decoration:none}
.dp-edit{width:100%;font-size:13px;background:#fff;border:1px solid var(--plomo);border-radius:2px;padding:3px 5px}
.dp-x{background:none;border:none;color:var(--plomo);font-size:15px;line-height:1;padding:1px 2px}
.dp-x:hover{color:var(--alerta)}
.dp.hecho .dp-txt{text-decoration:line-through;color:var(--grafito)}
.dp.hecho .dp-box{background:var(--hecho);border-color:var(--hecho);color:#fff}
.dp-vacio{font-size:12px;color:var(--grafito);font-style:italic;margin:6px 2px}
.desp-pie{border-top:1px solid var(--plomo);margin-top:8px;padding-top:8px}
.desp-pie button{background:none;border:none;color:var(--grafito);font-size:11px;padding:2px 0;text-decoration:underline}
.desp-pie button:hover{color:var(--alerta)}

/* ---------- ventana ---------- */
.velo{position:fixed;inset:0;background:rgba(22,32,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal{background:var(--papel2);border:1px solid var(--tinta);border-radius:3px;max-width:600px;width:100%;padding:22px}
.modal h3{margin:2px 0 16px;font-size:20px;letter-spacing:-.01em}
.campo{margin-bottom:12px;min-width:0}
.campo > label,.campo > .lab{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grafito);font-weight:700;margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;background:#fff;border:1px solid var(--plomo);border-radius:2px;padding:8px 9px}
.campo textarea{min-height:64px;resize:vertical}
.campo .seg{display:flex}
.campo .seg button{flex:1 1 auto}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.acciones .izq{margin-right:auto}
.nota{font-size:12px;color:var(--grafito);margin:10px 0 0}
.tipo-sel{margin-bottom:16px}
.tipo-sel .seg{display:flex}
.tipo-sel .seg button{flex:1;padding:10px 12px;font-size:12px}

/* ---------- datos ---------- */
.estado{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--grafito)}
.punto{width:8px;height:8px;border-radius:50%;background:var(--hecho);display:inline-block}
.punto.mal{background:var(--alerta)}
.aviso-guardado{border:1px solid var(--aviso);background:#FFF8E1;border-left:4px solid var(--aviso);padding:12px 14px;border-radius:2px;margin-bottom:18px;font-size:13px}
.bloque{border-top:1px solid var(--plomo);padding-top:16px;margin-top:20px}
.bloque h3{font-size:15px;margin:0 0 6px}
.bloque p{margin:0 0 12px;font-size:13px;color:var(--grafito);max-width:62ch}

/* en plena nota, toda la pantalla para escribir */
body.en-nota header.top,body.en-nota .tally{display:none}
body.en-nota nav.tabs{margin-top:8px}

@media (max-width:1060px){
  .cuerpo{display:block}
  .despacho{position:static;max-height:none;margin-top:16px}
}
@media (max-width:720px){
  .app{padding:0 12px 60px}
  .lista{margin-left:22px}
  .ck{grid-template-columns:22px minmax(0,1fr);gap:8px}
  .ck-cuando{grid-column:2;margin-top:-2px}
  .fila{grid-template-columns:58px minmax(0,1fr) auto;gap:10px}
  .b0 .dist,.b1 .dist{font-size:24px}
  .dia{min-height:70px}
  .anio-cab,.pista-fila{grid-template-columns:110px 1fr}
  .dosc{grid-template-columns:1fr}
  .sub{grid-template-columns:24px minmax(0,1fr) 26px}
  .sub input[type=date]{grid-column:2}
}

/* ---------- pantallas táctiles ---------- */
@media (pointer:coarse){
  nav.tabs button{padding:12px 16px}
  .btn{padding:10px 16px;font-size:14px}
  .seg button{padding:10px 14px}
  .fila{padding:13px 8px}
  .check,.chevron{width:36px;height:36px;font-size:16px}
  .ck-box,.dp-box{width:30px;height:30px;line-height:28px;font-size:15px}
  .ck{grid-template-columns:30px minmax(0,1fr) auto;padding:6px 6px 6px 0}
  .dp{grid-template-columns:30px minmax(0,1fr) 28px}
  .dp-x{font-size:20px}
  .mini{padding:8px 12px;font-size:18px}
  .sub{grid-template-columns:32px minmax(0,1fr) 150px 36px}
  .sub .ck-box{width:30px;height:30px;line-height:28px}
  .bar input,.bar select,.campo input,.campo select,.campo textarea,.desp-alta input,.sub input,.en-meta select{font-size:16px;padding:10px}
  .fila:hover,.ck:hover,.dia:hover{background:inherit}
}
@media (pointer:coarse) and (max-width:720px){
  .ck{grid-template-columns:30px minmax(0,1fr)}
  .sub{grid-template-columns:32px minmax(0,1fr) 36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  nav.tabs,.bar,.acc,.tally,.no-print{display:none!important}
  body{background:#fff}
  .panel{border:none;background:#fff;padding:0}
  .cuerpo{display:block}
  .despacho{position:static;max-height:none;margin-top:20px;break-inside:avoid}
  .desp-alta,.desp-pie{display:none}
  .fila{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand">
    <div class="eyebrow">Plan anual · actividades · notas</div>
    <h1>Agenda</h1>
    <div class="sub">Todo lo que viene, siempre a la vista.</div>
  </div>
  <div class="hoy"><strong id="hoyFecha">—</strong><span id="hoySem">—</span></div>
</header>

<div class="tally" id="tally"></div>

<nav class="tabs" role="tablist">
  <button role="tab" data-vista="agenda" aria-selected="true">Agenda</button>
  <button role="tab" data-vista="notas" aria-selected="false">Notas</button>
  <button role="tab" data-vista="mes" aria-selected="false">Mes</button>
  <button role="tab" data-vista="anio" aria-selected="false">Año</button>
  <button role="tab" data-vista="ajustes" aria-selected="false">Datos</button>
</nav>

<div class="cuerpo">
  <div class="panel" id="panel"></div>

  <aside class="despacho" id="despacho">
    <div class="desp-cab">
      <span class="eyebrow">Despachar con el jefe</span>
      <span class="desp-cuenta" id="despCuenta"></span>
    </div>
    <div class="desp-fecha" id="despFecha">—</div>
    <form class="desp-alta" id="despAlta" autocomplete="off">
      <input type="text" id="despTexto" placeholder="Tema a despachar…" aria-label="Tema a despachar">
      <button class="btn" type="submit" title="Apuntar">+</button>
    </form>
    <div class="desp-lista" id="despLista"></div>
    <div class="desp-pie"><button type="button" id="despLimpiar">Quitar los despachados</button></div>
  </aside>
</div>
</div>

<div id="modalHost"></div>

<script>
"use strict";

/* ==================== almacenamiento ==================== */
// se mantiene la clave de la versión anterior para no perder lo ya guardado
const CLAVE = "horizonte-s2s3";
let persistencia = "comprobando";

function cargar(){
  try{
    const t = localStorage.getItem(CLAVE);
    localStorage.setItem(CLAVE+"-test","1"); localStorage.removeItem(CLAVE+"-test");
    persistencia="ok";
    return t ? JSON.parse(t) : null;
  }catch(e){ persistencia="no"; return null; }
}
let guardarPendiente=null;
function guardar(){
  clearTimeout(guardarPendiente);
  guardarPendiente=setTimeout(guardarYa,250);
}
function guardarYa(){
  clearTimeout(guardarPendiente);
  try{ localStorage.setItem(CLAVE,JSON.stringify(db)); persistencia="ok"; }
  catch(e){ persistencia="no"; }
}
window.addEventListener("pagehide",guardarYa);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") guardarYa(); });

/* ==================== datos ==================== */
const uid = ()=> Math.random().toString(36).slice(2,10);

const RESP=[
  ["S1","Personal"],
  ["S2","Información y seguridad"],
  ["S3","Operaciones"],
  ["S4","Logística"],
  ["BIA SVS","Batería de Servicios"]
];
function claseResp(r){ const i=RESP.findIndex(x=>x[0]===r); return "r"+(i<0?2:i); }
function tagResp(r){ return '<span class="tag '+claseResp(r)+'">'+esc(r||"—")+'</span>'; }
function opcionesResp(sel){
  return RESP.map(r=>'<option value="'+r[0]+'"'+(r[0]===sel?" selected":"")+'>'+r[0]+' · '+r[1]+'</option>').join("");
}

let db = {v:2,actividades:[],eventos:[],despacho:[],notas:[],ui:{}};
let vista="agenda";
let filtroResp="todo";
let busqueda="";
let verHechos=false;
let agrupar=false;
let abiertas={};
let mesVista=new Date();
let anioVista=new Date().getFullYear();
let notaAbierta=null;
let buscaNotas="";

/* ==================== fechas ==================== */
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_C=["D","L","M","X","J","V","S"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MESES_C=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function hoy(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function aFecha(iso){ if(!iso) return null; const p=iso.split("-"); const d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0); return d; }
function aISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function sumarDias(iso,n){ const d=aFecha(iso); if(!d) return null; d.setDate(d.getDate()+n); return aISO(d); }
function dist(iso){ const d=aFecha(iso); if(!d) return null; return Math.round((d-hoy())/86400000); }
function fechaCorta(iso){ const d=aFecha(iso); if(!d) return ""; return DIAS_C[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+" "+MESES_C[d.getMonth()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function edad(iso){ const d=aFecha(iso); if(!d) return 0; return Math.max(0,Math.round((hoy()-d)/86400000)); }
function cuandoEditada(ts){
  if(!ts) return "";
  const d=new Date(ts), h=hoy();
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const dd=new Date(d); dd.setHours(0,0,0,0);
  const n=Math.round((h-dd)/86400000);
  if(n===0) return "hoy "+hm;
  if(n===1) return "ayer "+hm;
  return String(d.getDate()).padStart(2,"0")+" "+MESES_C[d.getMonth()]+(d.getFullYear()!==h.getFullYear()?" "+d.getFullYear():"")+" "+hm;
}

/* ==================== consultas ==================== */
function actividad(id){ return db.actividades.find(a=>a.id===id)||null; }
function pasaFiltro(r){ return filtroResp==="todo" || r===filtroResp; }

function eventosVisibles(){
  return db.eventos.filter(e=>{
    if(!pasaFiltro(e.seccion)) return false;
    if(!verHechos && e.hecho) return false;
    if(busqueda){
      const a=actividad(e.actividadId);
      const txt=(e.titulo+" "+(a?a.nombre:"")+" "+(e.resp||"")+" "+(e.notas||"")+" "+(e.subtareas||[]).map(s=>s.texto).join(" ")).toLowerCase();
      if(!txt.includes(busqueda.toLowerCase())) return false;
    }
    return true;
  }).sort((x,y)=> x.fecha<y.fecha?-1:x.fecha>y.fecha?1:0);
}

const GRUPOS=[
  {k:"b0",lab:"Vencido",test:d=>d<0,rojo:true},
  {k:"b1",lab:"Hoy",test:d=>d===0,rojo:true},
  {k:"b2",lab:"Próximos 7 días",test:d=>d>=1&&d<=7},
  {k:"b3",lab:"8 a 15 días",test:d=>d>=8&&d<=15},
  {k:"b4",lab:"16 a 30 días",test:d=>d>=16&&d<=30},
  {k:"b5",lab:"31 a 60 días",test:d=>d>=31&&d<=60},
  {k:"b6",lab:"61 a 90 días",test:d=>d>=61&&d<=90},
  {k:"b7",lab:"Más allá de 90 días",test:d=>d>90}
];

/* ==================== render ==================== */
function render(){
  const h=hoy();
  document.getElementById("hoyFecha").textContent = String(h.getDate()).padStart(2,"0")+" "+MESES[h.getMonth()]+" "+h.getFullYear();
  document.getElementById("hoySem").textContent = DIAS[h.getDay()];
  renderTally();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.vista===vista?"true":"false"));
  const p=document.getElementById("panel");
  if(vista==="agenda") p.innerHTML=vistaAgenda();
  else if(vista==="notas") p.innerHTML=vistaNotas();
  else if(vista==="mes") p.innerHTML=vistaMes();
  else if(vista==="anio") p.innerHTML=vistaAnio();
  else p.innerHTML=vistaAjustes();
  renderDespacho();
  const enNotas = vista==="notas";
  document.getElementById("despacho").style.display = enNotas?"none":"";
  document.querySelector(".cuerpo").classList.toggle("ancho",enNotas);
  document.body.classList.toggle("en-nota", enNotas && !!notaAbierta);
  if(enNotas && notaAbierta) montarNota();
}

function renderTally(){
  const act=db.eventos.filter(e=>!e.hecho && pasaFiltro(e.seccion));
  const conF=act.filter(e=>!e.bolsa && e.fecha);
  const venc=conF.filter(e=>dist(e.fecha)<0).length;
  const sem=conF.filter(e=>{const d=dist(e.fecha);return d>=0&&d<=7;}).length;
  const asap=act.filter(e=>e.bolsa==="asap").length;
  const sinf=act.filter(e=>e.bolsa==="sinfecha" && !actividad(e.actividadId)).length +
    db.actividades.filter(a=>!a.fechaD&&pasaFiltro(a.seccion)).length;
  const acts=db.actividades.filter(a=>pasaFiltro(a.seccion)).length;
  document.getElementById("tally").innerHTML=
    tallyItem(venc,"Vencidos",venc>0?"rojo":"")+
    tallyItem(asap,"Cuanto antes",asap>0?"rojo":"")+
    tallyItem(sem,"Próximos 7 días",sem>0?"ambar":"")+
    tallyItem(sinf,"Sin fecha","")+
    tallyItem(acts,"Actividades vivas","");
}
function tallyItem(n,lab,cls){ return '<div><div class="n '+cls+'">'+n+'</div><div class="lab">'+lab+'</div></div>'; }

function barraFiltros(extra){
  return '<div class="bar no-print">'+
    '<div class="seg" aria-label="Responsable">'+
      ['todo'].concat(RESP.map(r=>r[0])).map(s=>'<button data-resp="'+s+'" aria-pressed="'+(filtroResp===s)+'" title="'+(s==="todo"?"Todos los responsables":esc(RESP.find(r=>r[0]===s)[1]))+'">'+(s==="todo"?"TODO":s)+'</button>').join("")+
    '</div>'+
    '<input type="text" id="buscar" placeholder="Buscar…" value="'+esc(busqueda)+'">'+
    (extra||"")+
    '<button class="btn" id="nuevo">+ Nuevo</button>'+
  '</div>';
}

/* ---------- agenda ---------- */
function vistaAgenda(){
  const evs=eventosVisibles();
  let html=barraFiltros(
    '<label class="estado"><input type="checkbox" id="verHechos" '+(verHechos?"checked":"")+'> Ver completados</label>'+
    '<label class="estado" title="Las subtareas de una actividad dejan de aparecer sueltas y sólo se ven dentro de ella"><input type="checkbox" id="agrupar" '+(agrupar?"checked":"")+'> Subtareas sólo dentro de su actividad</label>'
  );
  if(!db.actividades.length && !db.eventos.length){
    return html+'<div class="vacio"><p>Aquí aparecerá todo lo que tienes por delante, de lo más cercano a lo más lejano.</p>'+
      '<button class="btn" id="nuevo2">Apuntar lo primero</button></div>';
  }
  const libre = e=>!actividad(e.actividadId);   // las subtareas sin fecha viven dentro de su actividad
  const asap=evs.filter(e=>e.bolsa==="asap").sort((x,y)=>(x.creado||"")<(y.creado||"")?-1:1);
  const sinf=evs.filter(e=>e.bolsa==="sinfecha" && libre(e)).sort((x,y)=>(x.creado||"")<(y.creado||"")?-1:1);
  const actsFil=actividadesFiltradas();
  const actsSinD=actsFil.filter(a=>!a.fechaD);
  const actsConD=actsFil.filter(a=>a.fechaD && (dist(a.fechaD)>=0 || progreso(a).pend>0 || verHechos));
  const conChecklist={}; actsConD.forEach(a=>conChecklist[a.id]=true);

  const conFecha=evs
    .filter(e=>!e.bolsa && e.fecha && !(agrupar && e.actividadId && conChecklist[e.actividadId]))
    .map(e=>({f:e.fecha,d:dist(e.fecha),html:filaEvento(e)}))
    .concat(actsConD.map(a=>({f:a.fechaD,d:dist(a.fechaD),html:filaActividad(a)})))
    .sort((x,y)=> x.f<y.f?-1:x.f>y.f?1:0);

  if(!conFecha.length && !asap.length && !sinf.length && !actsSinD.length)
    return html+'<div class="vacio"><p>No hay nada pendiente con ese filtro.</p></div>';

  function seccion(clase,lab,rojo,pista,filas){
    if(!filas.length) return "";
    return '<section class="grupo '+clase+'">'+
      '<div class="grupo-cab"><span class="eyebrow'+(rojo?" rojo":"")+'">'+lab+'</span>'+
      (pista?'<span class="pista-txt">'+pista+'</span>':'')+
      '<span class="linea"></span><span class="cuenta">'+filas.length+'</span></div>'+
      filas.join("")+'</section>';
  }
  html+=seccion("b0","Vencido",true,"",conFecha.filter(i=>i.d<0).map(i=>i.html));
  html+=seccion("basap","Cuanto antes",true,"Sin fecha, pero para ya.",asap.map(filaEvento));
  GRUPOS.slice(1).forEach(g=>{
    html+=seccion(g.k,g.lab,g.rojo,"",conFecha.filter(i=>g.test(i.d)).map(i=>i.html));
  });
  html+=seccion("bsin","Sin fecha",false,"Esperando fecha. Repásalas los viernes.",actsSinD.map(filaActividadSinFecha).concat(sinf.map(filaEvento)));
  return html;
}

function subsInfo(e){
  const s=e.subtareas||[];
  return {total:s.length,hechos:s.filter(x=>x.hecho).length};
}
function filaEvento(e){
  const d=dist(e.fecha);
  const a=actividad(e.actividadId);
  const dias=edad(e.creado);
  let etq,pieDist="",claseDist="";
  const meta=[];
  if(e.bolsa==="asap"){
    etq = e.hecho?"✓":(dias===0?"HOY":dias);
    pieDist = dias===0?"abierto hoy":"d abierto";
    if(dias>7 && !e.hecho){ claseDist=" viejo"; meta.push('<span class="avisillo">lleva '+dias+' días como urgente: ponle fecha o hazlo</span>'); }
  }else if(e.bolsa==="sinfecha"){
    etq = e.hecho?"✓":"—"; claseDist=" nada";
    pieDist = dias===0?"apuntado hoy":"hace "+dias+" d";
    if(dias>45 && !e.hecho) meta.push('<span class="avisillo">'+dias+' días sin fecha</span>');
  }else{
    etq = e.hecho?"✓":(d===0?"HOY":d+" d");
    pieDist = fechaCorta(e.fecha);
  }
  if(a) meta.push(esc(a.nombre));
  if(e.resp) meta.push(esc(e.resp));
  if(e.offset!=null && a && a.fechaD) meta.push("D"+(e.offset<0?e.offset:"+"+e.offset));
  const si=subsInfo(e);
  if(si.total) meta.push(si.hechos+"/"+si.total+" subtareas");
  const abierta = si.total && abiertas[e.id];
  const fila='<div class="fila'+(e.hecho?" done":"")+(si.total?" act":"")+'" data-ev="'+e.id+'" role="button" tabindex="0">'+
    '<span class="dist'+claseDist+'">'+etq+'<span class="'+(e.bolsa?"sub":"fecha")+'">'+pieDist+'</span></span>'+
    '<span style="min-width:0"><span class="titulo">'+esc(e.titulo)+'</span>'+
      '<span class="meta">'+tagResp(e.seccion)+(meta.length?'<span class="sep">·</span>'+meta.join('<span class="sep">·</span>'):'')+'</span>'+
      (si.total?'<span class="progreso"><span style="width:'+Math.round(si.hechos/si.total*100)+'%"></span></span>':'')+
    '</span>'+
    '<span class="acc">'+
      (si.total?'<button class="chevron" data-subtoggle="'+e.id+'" title="'+(abierta?"Plegar":"Ver")+' subtareas">'+(abierta?"▾":"▸")+'</button>':'')+
      '<button class="check" data-hecho="'+e.id+'" title="Marcar hecho">'+(e.hecho?"✓":"")+'</button>'+
    '</span>'+
  '</div>';
  if(!si.total) return fila;
  let lista="";
  if(abierta){
    lista='<div class="lista">'+e.subtareas.map(s=>{
      const ds=s.fecha?dist(s.fecha):null;
      const cls=s.hecho?" hecho":(ds!=null&&ds<0?" vencido":ds===0?" hoy":"");
      return '<div class="ck'+cls+'"><button class="ck-box" data-subhecho="'+e.id+'|'+s.id+'" title="Marcar como hecha">'+(s.hecho?"✓":"")+'</button>'+
        '<span class="ck-nom" data-ev="'+e.id+'">'+esc(s.texto)+'</span>'+
        '<span class="ck-cuando">'+(s.hecho?"hecha":s.fecha?fechaCorta(s.fecha)+(ds<0?" · vencida":ds===0?" · HOY":" · en "+ds+" d"):"")+'</span></div>';
    }).join("")+'</div>';
  }
  return '<div class="grupo-item">'+fila+lista+'</div>';
}

function filaActividadSinFecha(a){
  const p=progreso(a);
  const meta=[];
  if(a.unidad) meta.push(esc(a.unidad));
  if(p.total) meta.push(p.hechos+"/"+p.total+" subtareas");
  meta.push('<span class="avisillo">ponle día D cuando lo tengas</span>');
  return '<div class="fila" data-act="'+a.id+'" role="button" tabindex="0">'+
    '<span class="dist nada">—<span class="sub">sin día D</span></span>'+
    '<span style="min-width:0"><span class="titulo">'+esc(a.nombre)+'</span>'+
      '<span class="meta"><span class="tag act">ACTIVIDAD</span>'+tagResp(a.seccion)+
      '<span class="sep">·</span>'+meta.join('<span class="sep">·</span>')+'</span></span>'+
    '<span class="acc"></span>'+
  '</div>';
}

/* ---------- subtareas de actividad ---------- */
function hitosDe(a){
  return db.eventos.filter(e=>e.actividadId===a.id)
    .sort((x,y)=>{ const fx=x.fecha||"9999-99-99", fy=y.fecha||"9999-99-99"; return fx<fy?-1:fx>fy?1:0; });
}
function progreso(a){
  const h=hitosDe(a);
  return {total:h.length,hechos:h.filter(e=>e.hecho).length,pend:h.filter(e=>!e.hecho).length};
}
function estaAbierta(a){
  if(abiertas[a.id]!==undefined) return abiertas[a.id];
  if(!a.fechaD) return false;
  return dist(a.fechaD)<=30 && progreso(a).pend>0;
}
function cuandoHito(e){
  if(e.hecho) return "hecho"+(e.fechaHecho?" "+fechaCorta(e.fechaHecho):"");
  if(e.bolsa==="asap") return "cuanto antes";
  if(!e.fecha) return "sin fecha";
  const d=dist(e.fecha);
  if(d<0) return fechaCorta(e.fecha)+" · vencido hace "+(-d)+" d";
  if(d===0) return fechaCorta(e.fecha)+" · HOY";
  return fechaCorta(e.fecha)+" · en "+d+" d";
}
function claseHito(e){
  if(e.hecho) return " hecho";
  if(!e.fecha||e.bolsa) return "";
  const d=dist(e.fecha);
  return d<0?" vencido":d===0?" hoy":"";
}
function checklistHTML(a){
  const hs=hitosDe(a);
  let html='<div class="lista">';
  if(!hs.length) html+='<p class="nota" style="margin:4px 0 2px">Sin subtareas. Añade aquí los documentos o pasos que hay que preparar.</p>';
  hs.forEach(e=>{
    html+='<div class="ck'+claseHito(e)+'">'+

function filaActividad(a){
  const p=progreso(a), abierta=estaAbierta(a), d=dist(a.fechaD);

  const pc = p.total?Math.round(p.hechos/p.total*100):0;
  return '<div class="grupo-item">'+

      '<span style="min-width:0"><span class="titulo">'+esc(a.nombre)+'</span>'+
        '<span class="meta"><span class="tag act">ACTIVIDAD</span>'+tagResp(a.seccion)+
        (meta.length?'<span class="sep">·</span>'+meta.join('<span class="sep">·</span>'):'')+'</span>'+
        (p.total?'<span class="progreso"><span style="width:'+pc+'%"></span></span>':'')+
      '</span>'+

function actividadesFiltradas(){
  return db.actividades.filter(a=>{

    if(busqueda){
      const txt=(a.nombre+" "+(a.unidad||"")+" "+(a.notas||"")).toLowerCase();
      if(!txt.includes(busqueda.toLowerCase())) return false;
    }

/* ---------- mes ---------- */
function vistaMes(){
  const y=mesVista.getFullYear(), m=mesVista.getMonth();
  const primero=new Date(y,m,1); const offset=(primero.getDay()+6)%7;
  const ini=new Date(y,m,1-offset);
  const evs=eventosVisibles();
  const actsMes=actividadesFiltradas().filter(a=>a.fechaD);
  let html=barraFiltros();
  html+='<div class="mescab no-print"><button class="btn ghost" id="mesPrev" aria-label="Mes anterior">‹</button>'+
    '<h2>'+MESES[m]+" "+y+'</h2><button class="btn ghost" id="mesNext" aria-label="Mes siguiente">›</button>'+
    '<button class="btn ghost" id="mesHoy">Hoy</button></div>';
  html+='<div class="rejilla-scroll"><div class="rejilla">'+["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=>'<div class="dow">'+d+'</div>').join("");
  const hoyISO=aISO(hoy());
  for(let i=0;i<42;i++){
    const d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+i);
    const iso=aISO(d);
    const actsDia=actsMes.filter(a=> iso>=a.fechaD && iso<=(a.fechaFin||a.fechaD));
    const dia=evs.filter(e=>e.fecha===iso);
    let chips="";
    actsDia.forEach(a=>{
      const pr=progreso(a);
      chips+='<span class="chip act '+claseResp(a.seccion)+'" data-actmodal="'+a.id+'">'+esc(a.nombre)+(pr.total?' <span class="cl">'+pr.hechos+'/'+pr.total+'</span>':'')+'</span>';
    });
    const hueco=Math.max(1,3-actsDia.length);
    dia.slice(0,hueco).forEach(e=>{
      chips+='<span class="chip '+claseResp(e.seccion)+(e.hecho?" done":(iso<hoyISO?" vencido":""))+'" data-evchip="'+e.id+'">'+esc(e.titulo)+'</span>';
    });
    if(dia.length>hueco) chips+='<span class="chip mas">+'+(dia.length-hueco)+' más</span>';
    html+='<button class="dia'+(d.getMonth()===m?"":" fuera")+(iso===hoyISO?" hoy":"")+'" data-dia="'+iso+'">'+
      '<span class="num">'+d.getDate()+'</span>'+chips+'</button>';
  }
  html+='</div></div><p class="nota">Las actividades salen en negrita con su cuenta de subtareas: púlsalas para abrirlas. '+
    'Pulsa un día para apuntar algo en esa fecha. '+avisoSinFecha()+'</p>';
  return html;
}
function avisoSinFecha(){
  const n=db.eventos.filter(e=>e.bolsa&&!e.hecho&&pasaFiltro(e.seccion)&&!actividad(e.actividadId)).length+
          db.actividades.filter(a=>!a.fechaD&&pasaFiltro(a.seccion)).length;
  if(!n) return "";
  return "Hay "+n+(n===1?" cosa sin fecha que no sale":" cosas sin fecha que no salen")+" en esta vista; están en la agenda.";
}

/* ---------- año ---------- */
function vistaAnio(){
  let html=barraFiltros();
  html+='<div class="mescab no-print"><button class="btn ghost" id="anioPrev" aria-label="Año anterior">‹</button>'+
    '<h2>'+anioVista+'</h2><button class="btn ghost" id="anioNext" aria-label="Año siguiente">›</button></div>';
  const acts=db.actividades.filter(a=>{
    if(!pasaFiltro(a.seccion) || !a.fechaD) return false;
    return aFecha(a.fechaD).getFullYear()===anioVista || (a.fechaFin && aFecha(a.fechaFin).getFullYear()===anioVista);
  }).sort((x,y)=>x.fechaD<y.fechaD?-1:1);
  if(!acts.length) return html+'<div class="vacio"><p>No hay actividades con día D en '+anioVista+'.</p></div>';
  const ini=new Date(anioVista,0,1), fin=new Date(anioVista,11,31);
  const total=(fin-ini)/86400000+1;
  const pct=d=>Math.max(0,Math.min(100,((aFecha(d)-ini)/86400000)/total*100));
  html+='<div class="anio-cab"><div class="eyebrow">Actividad</div><div class="meses">'+MESES_C.map(m=>'<span>'+m+'</span>').join("")+'</div></div>';
  const hoyD=hoy();
  const hoyPct = hoyD.getFullYear()===anioVista ? ((hoyD-ini)/86400000)/total*100 : null;
  acts.forEach(a=>{
    const p1=pct(a.fechaD), p2=pct(a.fechaFin||a.fechaD);
    const w=Math.max(0.7,p2-p1+0.3);
    let marcas="";
    for(let i=1;i<12;i++) marcas+='<span class="mesline" style="left:'+(i/12*100)+'%"></span>';
    db.eventos.filter(e=>e.actividadId===a.id&&e.fecha&&aFecha(e.fecha).getFullYear()===anioVista).forEach(e=>{
      marcas+='<span class="hito'+(!e.hecho&&dist(e.fecha)<0?" vencido":"")+'" style="left:'+pct(e.fecha)+'%"></span>';
    });
    if(hoyPct!==null) marcas+='<span class="hoyline" style="left:'+hoyPct+'%"></span>';
    html+='<div class="pista-fila"><div class="pista-nom" title="'+esc(a.nombre)+'">'+esc(a.nombre)+'</div>'+
      '<button class="pista" data-actmodal="'+a.id+'" title="Abrir esta actividad">'+marcas+
      '<span class="barra '+claseResp(a.seccion)+'" style="left:'+p1+'%;width:'+w+'%"></span></button></div>';
  });
  html+='<p class="nota">Cada barra es una actividad, con el color de su responsable; las marcas verticales son sus subtareas y las rojas, las vencidas. La línea roja es hoy. '+avisoSinFecha()+'</p>';
  return html;
}

function montarNota(){

function autoAlto(ta){ ta.style.height="auto"; ta.style.height=Math.max(ta.scrollHeight, window.innerHeight*0.55)+"px"; }
function pie(){
  const ta=document.getElementById("nTxt"), el=document.getElementById("nPie"); if(!ta||!el) return;
  const t=ta.value.trim();
  const pal=t?t.split(/\s+/).length:0;
  const cas=(ta.value.match(/^[☐☑]/gm)||[]).length, hechas=(ta.value.match(/^☑/gm)||[]).length;
  el.textContent=pal+(pal===1?" palabra":" palabras")+" · "+ta.value.length+" caracteres"+(cas?" · "+hechas+" de "+cas+" casillas marcadas":"");
}
function tocarNota(){
  const n=nota(notaAbierta); if(!n) return;
  n.titulo=document.getElementById("nTit").value;
  n.texto=document.getElementById("nTxt").value;
  n.mod=Date.now();
  guardar();
  const g=document.getElementById("nGuardado"); if(g) g.textContent="Guardada "+cuandoEditada(n.mod);
}
function cerrarNota(){
  const n=nota(notaAbierta);
  if(n && !n.titulo.trim() && !n.texto.trim()) db.notas=db.notas.filter(x=>x.id!==n.id);  // una nota vacía no se guarda
  notaAbierta=null; guardarYa(); render(); window.scrollTo(0,0);
}
function insertarEnNota(txt,alInicioDeLinea){
  const ta=document.getElementById("nTxt"); if(!ta) return;
  const v=ta.value, p=ta.selectionStart;
  let ins=txt, pos=p;
  if(alInicioDeLinea){
    const ini=v.lastIndexOf("\n",p-1)+1;
    if(p!==ini){ ins="\n"+txt; }
  }
  ta.value=v.slice(0,pos)+ins+v.slice(ta.selectionEnd);
  const np=pos+ins.length;
  ta.focus(); ta.setSelectionRange(np,np);
  autoAlto(ta); pie(); tocarNota();
}

/* ==================== bloc de despacho ==================== */
function notas(){ if(!Array.isArray(db.despacho)) db.despacho=[]; return db.despacho; }
function renderDespacho(){
  const lista=notas();
  const pend=lista.filter(n=>!n.hecho).length;
  const h=hoy();
  document.getElementById("despFecha").textContent=DIAS[h.getDay()]+" "+String(h.getDate()).padStart(2,"0")+" "+MESES[h.getMonth()];
  const c=document.getElementById("despCuenta");
  c.textContent = lista.length ? pend+" de "+lista.length : "";
  c.className = "desp-cuenta"+(pend?" rojo":"");
  document.getElementById("despLista").innerHTML = lista.length
    ? lista.map(n=>{
        const d=edad(n.creado);
        return '<div class="dp'+(n.hecho?" hecho":"")+'">'+
          '<button class="dp-box" data-dphecho="'+n.id+'" title="'+(n.hecho?"Volver a dejarlo pendiente":"Marcar como despachado")+'">'+(n.hecho?"✓":"")+'</button>'+
          '<button class="dp-txt" data-dpedit="'+n.id+'" title="Editar el tema">'+esc(n.texto)+
            (!n.hecho&&d>0?'<span class="dp-dias">apuntado hace '+d+(d===1?" día":" días")+'</span>':'')+'</button>'+
          '<button class="dp-x" data-dpdel="'+n.id+'" title="Quitar">×</button>'+
        '</div>';
      }).join("")
    : '<p class="dp-vacio">Nada apuntado todavía. Escribe arriba lo que quieras despachar.</p>';
  document.getElementById("despLimpiar").style.display = lista.some(n=>n.hecho)?"":"none";
}
function editarNotaDesp(id){
  const n=notas().find(x=>x.id===id); if(!n) return;
  const btn=document.querySelector('[data-dpedit="'+id+'"]'); if(!btn) return;
  const inp=document.createElement("input");
  inp.type="text"; inp.className="dp-edit"; inp.value=n.texto;
  btn.replaceWith(inp); inp.focus(); inp.select();
  let cerrado=false;
  const fin=(aplicar)=>{
    if(cerrado) return; cerrado=true;
    if(aplicar){ const v=inp.value.trim(); if(v) n.texto=v; else db.despacho=notas().filter(x=>x.id!==id); guardar(); }
    renderDespacho();
  };
  inp.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"){ ev.preventDefault(); fin(true); }
    else if(ev.key==="Escape"){ ev.stopPropagation(); fin(false); }
  });
  inp.addEventListener("blur",()=>fin(true));
}
document.getElementById("despAlta").addEventListener("submit",ev=>{
  ev.preventDefault();
  const inp=document.getElementById("despTexto");
  const v=inp.value.trim(); if(!v) return;
  notas().push({id:uid(),texto:v,hecho:false,creado:aISO(hoy()),fechaHecho:null});
  inp.value=""; guardar(); renderDespacho(); inp.focus();
});
document.getElementById("despacho").addEventListener("click",ev=>{
  const t=ev.target;
  const ok=t.closest("[data-dphecho]");
  if(ok){ const n=notas().find(x=>x.id===ok.dataset.dphecho); if(n){ n.hecho=!n.hecho; n.fechaHecho=n.hecho?aISO(hoy()):null; guardar(); renderDespacho(); } return; }
  const ed=t.closest("[data-dpedit]"); if(ed){ editarNotaDesp(ed.dataset.dpedit); return; }
  const del=t.closest("[data-dpdel]"); if(del){ db.despacho=notas().filter(n=>n.id!==del.dataset.dpdel); guardar(); renderDespacho(); return; }
  if(t.closest("#despLimpiar")){ db.despacho=notas().filter(n=>!n.hecho); guardar(); renderDespacho(); }
});

function bloqueSubs(){

    '<button type="button" class="sub-add" id="subAdd">+ Añadir subtarea o documento</button></div></div>';

function enganchaSubs(){
  const caja=document.querySelector(".modal");
  caja.addEventListener("click",ev=>{
    const t=ev.target;
    if(t.closest("#subAdd")){ subs.push({id:uid(),texto:"",fecha:"",hecho:false}); pintaSubs(subs.length-1); return; }
    const ck=t.closest("[data-sck]"); if(ck){ const s=subs[+ck.dataset.sck]; s.hecho=!s.hecho; pintaSubs(); return; }
    const del=t.closest("[data-sdel]"); if(del){ subs.splice(+del.dataset.sdel,1); pintaSubs(); return; }
  });
  caja.addEventListener("input",ev=>{
    const t=ev.target;
    if(t.dataset.stx!=null) subs[+t.dataset.stx].texto=t.value;
    if(t.dataset.sfe!=null) subs[+t.dataset.sfe].fecha=t.value;
  });
  caja.addEventListener("keydown",ev=>{
    const t=ev.target;
    if(t.dataset.stx!=null && ev.key==="Enter"){   // Intro en una subtarea abre la siguiente
      ev.preventDefault();
      const i=+t.dataset.stx;
      subs.splice(i+1,0,{id:uid(),texto:"",fecha:"",hecho:false}); pintaSubs(i+1);
    }
  });
}

/* ---------- la ventana única: actividad o apunte ---------- */
// item: {tipo:"actividad"|"apunte", id?, fecha?, bolsa?, actividadId?, titulo?}
function editar(item){
  const tipo=item.tipo;
  const nuevo=!item.id;
  const selector = nuevo
    ? '<div class="tipo-sel"><div class="seg" id="tipoSel">'+
        '<button type="button" data-tipo="apunte" aria-pressed="'+(tipo==="apunte")+'">Apunte</button>'+
        '<button type="button" data-tipo="actividad" aria-pressed="'+(tipo==="actividad")+'">Actividad del plan</button>'+
      '</div></div>'
    : '';
  if(tipo==="actividad") formActividad(item,selector); else formApunte(item,selector);
  if(nuevo){
    document.getElementById("tipoSel").addEventListener("click",ev=>{
      const b=ev.target.closest("[data-tipo]"); if(!b || b.dataset.tipo===tipo) return;
      const tit=(document.getElementById("fTit")||{}).value||"";
      const resp=(document.getElementById("fResp")||{}).value;
      editar({tipo:b.dataset.tipo,titulo:tit,seccion:resp,fecha:item.fecha,bolsa:item.bolsa,actividadId:item.actividadId,subsKeep:true});
    });
  }
  const f=document.getElementById("fTit"); if(f && nuevo){ f.focus(); }
}

function formActividad(item,selector){
  const a = item.id ? actividad(item.id) : {id:null,nombre:item.titulo||"",seccion:item.seccion||filtroDefecto(),unidad:"",fechaD:item.fecha||"",fechaFin:"",notas:""};
  if(item.id) subs=hitosDe(a).map(e=>({id:e.id,evId:e.id,texto:e.titulo,fecha:e.fecha||"",hecho:!!e.hecho}));
  else if(!item.subsKeep) subs=[];
  const cuerpo=selector+
    '<div class="campo"><label for="fTit">Nombre de la actividad</label><input id="fTit" value="'+esc(a.nombre)+'" placeholder="Revista de vehículos de la Batería"></div>'+
    '<div class="dosc">'+
      '<div class="campo"><label for="fResp">Responsable</label><select id="fResp">'+opcionesResp(a.seccion)+'</select></div>'+
      '<div class="campo"><label for="fUnidad">Unidad o persona que la ejecuta</label><input id="fUnidad" value="'+esc(a.unidad||"")+'" placeholder="Sección de mantenimiento"></div>'+
    '</div>'+
    '<div class="dosc">'+
      '<div class="campo"><label for="fD">Día D (vacío si aún no lo hay)</label><input type="date" id="fD" value="'+esc(a.fechaD)+'"></div>'+
      '<div class="campo"><label for="fFin">Fecha fin (opcional)</label><input type="date" id="fFin" value="'+esc(a.fechaFin||"")+'"></div>'+
    '</div>'+
    bloqueSubs()+
    '<div class="campo"><label for="fNotas">Notas</label><textarea id="fNotas">'+esc(a.notas||"")+'</textarea></div>'+
    '<p class="nota">Las subtareas con fecha salen en la agenda y en el calendario; si mueves el día D, se mueven con él.</p>';
  const acc=(item.id?'<button class="btn peligro izq" id="mDel">Eliminar</button>':'')+
    '<button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mOk">Guardar</button>';
  modal(item.id?"Editar actividad":"Nuevo",cuerpo,acc);
  enganchaSubs();
  document.getElementById("mCancel").onclick=cerrarModal;
  const del=document.getElementById("mDel");
  if(del) del.onclick=()=>{
    if(!confirm("Se elimina la actividad y todas sus subtareas. ¿Seguimos?")) return;
    db.eventos=db.eventos.filter(e=>e.actividadId!==item.id);
    db.actividades=db.actividades.filter(x=>x.id!==item.id);
    guardar(); cerrarModal(); render();
  };
  document.getElementById("mOk").onclick=()=>{
    const nombre=document.getElementById("fTit").value.trim();
    if(!nombre){ alert("Ponle un nombre a la actividad."); return; }
    const datos={nombre:nombre,seccion:document.getElementById("fResp").value,
      unidad:document.getElementById("fUnidad").value.trim(),
      fechaD:document.getElementById("fD").value,fechaFin:document.getElementById("fFin").value,
      notas:document.getElementById("fNotas").value};
    let act;
    if(item.id){
      act=actividad(item.id);
      const dAnt=act.fechaD;
      Object.assign(act,datos);
      // si cambió el día D, las subtareas pendientes se mueven con él
      if(dAnt && act.fechaD && dAnt!==act.fechaD){
        const delta=Math.round((aFecha(act.fechaD)-aFecha(dAnt))/86400000);
        subs.forEach(s=>{ if(s.fecha && !s.hecho) s.fecha=sumarDias(s.fecha,delta); });
      }
    }else{ act=Object.assign({id:uid(),creado:aISO(hoy())},datos); db.actividades.push(act); }
    guardarSubsActividad(act);
    abiertas[act.id]=true;
    guardar(); cerrarModal(); vista="agenda"; render();
  };
}
function guardarSubsActividad(act){
  const vivos={};
  subs.filter(s=>s.texto.trim()).forEach(s=>{
    const off = act.fechaD && s.fecha ? Math.round((aFecha(s.fecha)-aFecha(act.fechaD))/86400000) : null;
    let e = s.evId ? db.eventos.find(x=>x.id===s.evId) : null;
    if(!e){ e={id:uid(),creado:aISO(hoy()),actividadId:act.id,notas:"",resp:""}; db.eventos.push(e); }
    const eraHecho=e.hecho;
    Object.assign(e,{titulo:s.texto.trim(),fecha:s.fecha||"",bolsa:s.fecha?null:"sinfecha",seccion:act.seccion,
      actividadId:act.id,offset:off,hecho:!!s.hecho});
    if(e.hecho && !eraHecho) e.fechaHecho=aISO(hoy());
    if(!e.hecho) e.fechaHecho=null;
    vivos[e.id]=true;
  });
  db.eventos=db.eventos.filter(e=>e.actividadId!==act.id || vivos[e.id]);
}

function formApunte(item,selector){
  const e = item.id ? db.eventos.find(x=>x.id===item.id) : {id:null,titulo:item.titulo||"",
    fecha:item.bolsa?"":(item.fecha||aISO(hoy())),seccion:item.seccion||filtroDefecto(),resp:"",
    actividadId:item.actividadId||"",notas:"",hecho:false,offset:null,bolsa:item.bolsa||null,subtareas:[]};
  if(item.id) subs=(e.subtareas||[]).map(s=>Object.assign({},s));
  else if(!item.subsKeep) subs=[];
  let cuando = e.bolsa || "fecha";
  const esSub = item.id && actividad(e.actividadId);
  const cuerpo=selector+
    '<div class="campo"><label for="fTit">'+(esSub?"Subtarea":"Qué es")+'</label><input id="fTit" value="'+esc(e.titulo)+'" placeholder="Pedir el listado de permisos de la Batería"></div>'+
    '<div class="campo"><span class="lab">Cuándo</span><div class="seg" id="gCuando">'+
      '<button type="button" data-cuando="fecha">Con fecha</button>'+
      '<button type="button" data-cuando="asap">Cuanto antes</button>'+
      '<button type="button" data-cuando="sinfecha">Sin fecha</button>'+
    '</div></div>'+
    '<div class="dosc">'+
      '<div class="campo" id="gCampoFecha"><label for="gFecha">Fecha</label><input type="date" id="gFecha" value="'+esc(e.fecha)+'"></div>'+
      '<div class="campo"><label for="fResp">Responsable</label><select id="fResp">'+opcionesResp(e.seccion)+'</select></div>'+
    '</div>'+
    '<div class="dosc">'+
      '<div class="campo"><label for="gResp">A cargo de (opcional)</label><input id="gResp" value="'+esc(e.resp||"")+'" placeholder="Sargento de la Sección"></div>'+
      '<div class="campo"><label for="gAct">Actividad asociada</label><select id="gAct"><option value="">— ninguna —</option>'+
        db.actividades.map(a=>'<option value="'+a.id+'"'+(a.id===e.actividadId?" selected":"")+'>'+esc(a.nombre)+'</option>').join("")+
      '</select></div>'+
    '</div>'+
    (esSub?'':bloqueSubs())+
    '<div class="campo"><label for="gNotas">Notas</label><textarea id="gNotas">'+esc(e.notas||"")+'</textarea></div>';
  const acc=(item.id?'<button class="btn peligro izq" id="gDel">Eliminar</button>':'')+
    '<button class="btn ghost" id="gCancel">Cancelar</button><button class="btn" id="gOk">Guardar</button>';
  modal(item.id?(esSub?"Editar subtarea":"Editar apunte"):"Nuevo",cuerpo,acc);
  if(!esSub) enganchaSubs();

  const seg=document.getElementById("gCuando");
  function pintaCuando(){
    seg.querySelectorAll("[data-cuando]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cuando===cuando));
    document.getElementById("gCampoFecha").style.display = cuando==="fecha"?"":"none";
  }
  seg.addEventListener("click",ev2=>{ const b=ev2.target.closest("[data-cuando]"); if(!b) return; cuando=b.dataset.cuando; pintaCuando(); });
  pintaCuando();

  document.getElementById("gCancel").onclick=cerrarModal;
  const del=document.getElementById("gDel");
  if(del) del.onclick=()=>{ db.eventos=db.eventos.filter(x=>x.id!==item.id); guardar(); cerrarModal(); render(); };
  document.getElementById("gOk").onclick=()=>{
    const tit=document.getElementById("fTit").value.trim();
    const f=document.getElementById("gFecha").value;
    if(!tit){ alert("Escribe de qué se trata."); return; }
    if(cuando==="fecha" && !f){ alert("Falta la fecha. Si aún no la tienes, elige «Cuanto antes» o «Sin fecha»."); return; }
    const datos={titulo:tit,fecha:cuando==="fecha"?f:"",bolsa:cuando==="fecha"?null:cuando,
      seccion:document.getElementById("fResp").value,resp:document.getElementById("gResp").value.trim(),
      actividadId:document.getElementById("gAct").value,notas:document.getElementById("gNotas").value};
    if(!esSub) datos.subtareas=subs.filter(s=>s.texto.trim()).map(s=>({id:s.id,texto:s.texto.trim(),fecha:s.fecha||"",hecho:!!s.hecho}));
    const actAsoc=actividad(datos.actividadId);
    datos.offset = (actAsoc && actAsoc.fechaD && datos.fecha) ? Math.round((aFecha(datos.fecha)-aFecha(actAsoc.fechaD))/86400000) : null;
    if(item.id) Object.assign(db.eventos.find(x=>x.id===item.id),datos);
    else db.eventos.push(Object.assign({id:uid(),hecho:false,creado:aISO(hoy())},datos));
    guardar(); cerrarModal(); render();
  };
}
function filtroDefecto(){ return filtroResp!=="todo" ? filtroResp : (db.ui.ultimoResp || "BIA SVS"); }

function abrirActividad(id){
  const a=actividad(id); if(!a) return;
  editar({tipo:"actividad",id:id});
}

/* ==================== eventos de interfaz ==================== */
document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click",()=>{
    if(vista==="notas" && notaAbierta && b.dataset.vista!=="notas") cerrarNota();
    vista=b.dataset.vista; render();
  });
});

document.getElementById("panel").addEventListener("click",ev=>{
  const t=ev.target;
  if(vista==="notas"){ clickNotas(ev); return; }

  const rb=t.closest("[data-resp]");
  if(rb){ filtroResp=rb.dataset.resp; render(); return; }
  if(t.closest("#nuevo")||t.closest("#nuevo2")){ editar({tipo:"apunte"}); return; }

  const chk=t.closest("[data-hecho]");
  if(chk){ ev.stopPropagation(); marcarHecho(chk.dataset.hecho); render(); return; }
  const sh=t.closest("[data-subhecho]");
  if(sh){
    const p=sh.dataset.subhecho.split("|"), e=db.eventos.find(x=>x.id===p[0]);
    const s=e && (e.subtareas||[]).find(x=>x.id===p[1]);
    if(s){ s.hecho=!s.hecho; guardar(); render(); }
    return;
  }
  const stg=t.closest("[data-subtoggle]");
  if(stg){ const id=stg.dataset.subtoggle; abiertas[id]=!abiertas[id]; render(); return; }
  const eact=t.closest("[data-editact]");
  if(eact){ abrirActividad(eact.dataset.editact); return; }
  const arow=t.closest("[data-actrow]");
  if(arow){ const a=actividad(arow.dataset.actrow); if(a) abiertas[a.id]=!estaAbierta(a); render(); return; }
  const cal=t.closest("[data-actmodal]");
  if(cal){ ev.stopPropagation(); abrirActividad(cal.dataset.actmodal); return; }
  const chip=t.closest("[data-evchip]");
  if(chip){ ev.stopPropagation(); editar({tipo:"apunte",id:chip.dataset.evchip}); return; }
  const fila=t.closest("[data-ev]");
  if(fila){ editar({tipo:"apunte",id:fila.dataset.ev}); return; }
  const dia=t.closest("[data-dia]");
  if(dia){ editar({tipo:"apunte",fecha:dia.dataset.dia}); return; }
  const sinD=t.closest("[data-act]");
  if(sinD){ abrirActividad(sinD.dataset.act); return; }

  if(t.closest("#mesPrev")){ mesVista=new Date(mesVista.getFullYear(),mesVista.getMonth()-1,1); render(); return; }
  if(t.closest("#mesNext")){ mesVista=new Date(mesVista.getFullYear(),mesVista.getMonth()+1,1); render(); return; }
  if(t.closest("#mesHoy")){ mesVista=new Date(); render(); return; }
  if(t.closest("#anioPrev")){ anioVista--; render(); return; }
  if(t.closest("#anioNext")){ anioVista++; render(); return; }

  if(t.closest("#exportar")){ exportar(); return; }
  if(t.closest("#importarBtn")){ document.getElementById("importar").click(); return; }
  if(t.closest("#imprimir")){ vista="agenda"; render(); setTimeout(()=>window.print(),80); return; }
  if(t.closest("#vaciar")){
    if(!confirm("Se borran todas las actividades y apuntes. Las notas se conservan. ¿Seguimos?")) return;
    db.actividades=[]; db.eventos=[]; guardar(); render();
  }
});
// las filas se pueden abrir también con el teclado
document.getElementById("panel").addEventListener("keydown",ev=>{
  if((ev.key==="Enter"||ev.key===" ") && ev.target.matches(".fila[role=button]")){ ev.preventDefault(); ev.target.click(); }
});

function clickNotas(ev){
  const t=ev.target;
  if(t.closest("[data-nnueva]")){
    const n={id:uid(),titulo:"",texto:"",fav:false,resp:"",creado:Date.now(),mod:0};
    db.notas.push(n); notaAbierta=n.id; render(); window.scrollTo(0,0); return;
  }
  const ab=t.closest("[data-nabrir]");
  if(ab){ notaAbierta=ab.dataset.nabrir; render(); window.scrollTo(0,0); return; }
  if(t.closest("[data-ncerrar]")){ cerrarNota(); return; }
  if(t.closest("[data-nfav]")){
    const n=nota(notaAbierta); n.fav=!n.fav; guardar();
    t.closest("[data-nfav]").setAttribute("aria-pressed",n.fav); return;
  }
  if(t.closest("[data-nborrar]")){
    if(!confirm("¿Eliminar esta nota?")) return;
    db.notas=db.notas.filter(x=>x.id!==notaAbierta); notaAbierta=null; guardarYa(); render(); return;
  }
  const ins=t.closest("[data-nins]");
  if(ins){ insertarEnNota(ins.dataset.nins,true); return; }
  if(t.closest("[data-nfecha]")){ const d=hoy(); insertarEnNota(DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear(),false); return; }
  // tocar una casilla ☐ al principio de una línea la marca
  if(t.id==="nTxt"){
    const ta=t, v=ta.value, p=ta.selectionStart;
    if(p!==ta.selectionEnd) return;
    const ini=v.lastIndexOf("\n",p-1)+1;
    const c=v[ini];
    if((c==="☐"||c==="☑") && p-ini<=2){
      ta.value=v.slice(0,ini)+(c==="☐"?"☑":"☐")+v.slice(ini+1);
      const fin=v.indexOf("\n",ini); const pos=fin<0?ta.value.length:fin;
      ta.setSelectionRange(pos,pos); pie(); tocarNota();
    }
  }
}

document.getElementById("panel").addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="buscar"){ busqueda=t.value; const pos=t.selectionStart; render();
    const nb=document.getElementById("buscar"); if(nb){ nb.focus(); nb.setSelectionRange(pos,pos); } return; }
  if(t.id==="buscarNotas"){ buscaNotas=t.value; const pos=t.selectionStart; render();
    const nb=document.getElementById("buscarNotas"); if(nb){ nb.focus(); nb.setSelectionRange(pos,pos); } return; }
  if(t.id==="nTit"||t.id==="nTxt"){ if(t.id==="nTxt"){ autoAlto(t); pie(); } tocarNota(); return; }
  if(t.id==="nResp"){ const n=nota(notaAbierta); if(n){ n.resp=t.value; guardar(); } return; }
});
// en una lista de la nota, Intro continúa la viñeta o la casilla
document.getElementById("panel").addEventListener("keydown",ev=>{
  const t=ev.target;
  if(t.id==="nTit" && ev.key==="Enter"){ ev.preventDefault(); document.getElementById("nTxt").focus(); return; }
  if(t.id!=="nTxt" || ev.key!=="Enter" || ev.shiftKey) return;
  const v=t.value, p=t.selectionStart, ini=v.lastIndexOf("\n",p-1)+1, linea=v.slice(ini,p);
  const m=linea.match(/^(• |- |☐ |☑ )/);
  if(!m) return;
  ev.preventDefault();
  if(linea.trim()===m[1].trim()){   // viñeta vacía: se acaba la lista
    t.value=v.slice(0,ini)+v.slice(p); t.setSelectionRange(ini,ini);
  }else{
    const marca=m[1]==="☑ "?"☐ ":m[1];
    t.value=v.slice(0,p)+"\n"+marca+v.slice(t.selectionEnd);
    const np=p+1+marca.length; t.setSelectionRange(np,np);
  }
  autoAlto(t); pie(); tocarNota();
});

document.getElementById("panel").addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="verHechos"){ verHechos=t.checked; render(); return; }
  if(t.id==="agrupar"){ agrupar=t.checked; db.ui.agrupar=agrupar; guardar(); render(); return; }
  if(t.id==="nResp"){ const n=nota(notaAbierta); if(n){ n.resp=t.value; guardar(); } return; }
  if(t.id==="importar" && t.files && t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!d || !Array.isArray(d.eventos)) throw new Error("formato");
        db=normalizar(d); abiertas={}; notaAbierta=null;
        guardarYa(); render();
        alert("Copia cargada: "+db.actividades.length+" actividades, "+db.eventos.length+" apuntes y "+db.notas.length+" notas.");
      }catch(err){ alert("Ese archivo no es una copia válida de la Agenda."); }
    };
    fr.readAsText(t.files[0]);
  }
});

document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") cerrarModal(); });

function exportar(){
  guardarYa();
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="agenda-"+aISO(hoy())+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ==================== arranque ==================== */
// adapta datos de la versión anterior (Horizonte): sin plantillas ni reuniones
function normalizar(d){
  const x=Object.assign({v:2,actividades:[],eventos:[],despacho:[],notas:[],ui:{}},d);
  delete x.tipos; delete x.reuniones; delete x.tinta;
  x.v=2; x.ui=x.ui||{};
  if(!Array.isArray(x.despacho)) x.despacho=[];
  if(!Array.isArray(x.notas)) x.notas=[];
  x.actividades.forEach(a=>{ delete a.tipoId; if(!a.seccion) a.seccion="S3"; });
  x.eventos.forEach(e=>{
    delete e.reunionId;
    if(e.bolsa===undefined) e.bolsa=null;
    if(!e.creado) e.creado=aISO(hoy());
    if(!e.fecha && !e.bolsa) e.bolsa="sinfecha";
    if(!e.seccion) e.seccion="S3";
  });
  return x;
}
(function(){
  const guardado=cargar();
  if(guardado){
    db=normalizar(guardado);
  }else{
    const d=aISO(hoy());
    const a={id:uid(),nombre:"Revista de vehículos — Batería de Servicios",seccion:"BIA SVS",unidad:"Sección de mantenimiento",
      fechaD:sumarDias(d,24),fechaFin:"",notas:"Ejemplo: edítala o bórrala.",creado:d};
    db.actividades.push(a);
    [["Relación de vehículos y conductores",-10],["Comprobar ITV y seguros",-7],["Parte de novedades",2]].forEach(h=>{
      db.eventos.push({id:uid(),titulo:h[0],fecha:sumarDias(a.fechaD,h[1]),bolsa:null,seccion:"BIA SVS",resp:"",
        actividadId:a.id,offset:h[1],hecho:false,notas:"",creado:d});
    });
    db.eventos.push({id:uid(),titulo:"Actualizar el estadillo de personal",fecha:sumarDias(d,3),bolsa:null,seccion:"S1",resp:"",
      actividadId:"",offset:null,hecho:false,notas:"Ejemplo.",creado:d,
      subtareas:[{id:uid(),texto:"Altas y bajas del mes",fecha:"",hecho:true},{id:uid(),texto:"Permisos pendientes",fecha:"",hecho:false}]});
    guardar();
  }
  agrupar=!!db.ui.agrupar;
  db.actividades.forEach(a=>{
    if(!a.fechaD) return;
    db.eventos.forEach(e=>{ if(e.actividadId===a.id && e.offset!=null && !e.hecho) e.fecha=sumarDias(a.fechaD,e.offset); });
  });
  render();
})();
